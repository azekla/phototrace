{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PhotoTrace — анализ изображений и просмотр метаданных">
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <title>{% block title %}PhotoTrace{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{% url 'analysis-index' %}" aria-label="PhotoTrace — на главную">
        <span class="brand-mark">P<span>.</span></span><span>PhotoTrace</span>
      </a>
      <nav class="main-nav" aria-label="Главная навигация">
        <a href="{% url 'analysis-index' %}" {% if request.resolver_match.url_name == 'analysis-index' %}class="active"{% endif %}>Проверить</a>
        <a href="{% url 'analysis-history' %}" {% if request.resolver_match.url_name == 'analysis-history' %}class="active"{% endif %}>История</a>
        <a href="{% url 'analysis-methodology' %}" {% if request.resolver_match.url_name == 'analysis-methodology' %}class="active"{% endif %}>Методика</a>
      </nav>
    </header>
    <main id="main-content">{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <span>PhotoTrace · Анализ изображений</span>
      <span>Оценка модели требует проверки человеком. <a href="{% url 'analysis-about' %}">О системе</a></span>
    </footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
